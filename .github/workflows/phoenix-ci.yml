name: Phoenix Platform CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: phoenix-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-runtime:
    name: Python runtime and harness
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile runtime and tooling
        run: python -m compileall -q scripts tests

      - name: Run dependency-free test suites
        run: >-
          python -m unittest
          tests.test_j_cli
          tests.test_j_ui
          tests.test_j_ui_workspace
          tests.test_j_forge
          tests.test_phoenix
          -v

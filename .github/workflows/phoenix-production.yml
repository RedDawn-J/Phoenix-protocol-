name: Phoenix Production Gate

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phoenix-production-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-runtime:
    name: Python compile and local runtime tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
      - name: Compile all Python packages
        run: python -m compileall -q backend scripts tests
      - name: Run backend tests
        env:
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: phoenix_ci
          EMERGENT_LLM_KEY: ci-placeholder
          OVERRIDE_PASSWORD: ci-placeholder-not-for-production
        run: pytest backend/tests/test_portable_profile.py -q
      - name: Run headless runtime tests
        run: >-
          python -m unittest
          tests.test_j_cli
          tests.test_j_ui
          tests.test_j_ui_workspace
          tests.test_j_forge
          tests.test_phoenix
          -v

  frontend-build:
    name: React production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile --non-interactive
      - name: Test loopback static server
        run: node --test launch/test-serve-build.test.js
      - name: Build optimized frontend
        working-directory: frontend
        env:
          CI: "true"
        run: yarn build
